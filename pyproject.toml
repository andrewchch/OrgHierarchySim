[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ladder-lab"
version = "0.1.0"
description = "Agent-based simulator for hierarchy formation, career ladders, and organisational evolution"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ladder Lab" }]
dependencies = []

[project.optional-dependencies]
web = ["flask>=3.0"]

[project.scripts]
orgsim = "orgsim.cli:main"

[tool.setuptools.packages.find]
include = ["orgsim*"]

[tool.setuptools.package-data]
orgsim = ["templates/*.html", "static/*.css", "static/*.js"]
